name: Implementation report
description: You tried to implement the standard — tell us what happened, whether it worked or not
title: "[impl] "
labels: ["implementation"]
body:
  - type: markdown
    attributes:
      value: |
        **The most valuable issue type in this repository.** "We tried to write
        this field and our hardware cannot produce it at that precision" settles
        arguments that discussion cannot. Successful reports matter too — they are
        the evidence that a part of the draft is ready to ratify.
  - type: input
    id: what
    attributes:
      label: What did you implement it in?
      placeholder: "Firmware / mobile app / analysis platform / library"
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Producer or consumer?
      options:
        - Producer — writes FIT files
        - Consumer — reads FIT files
        - Both
    validations:
      required: true
  - type: textarea
    id: worked
    attributes:
      label: What worked
      description: Which fields round-tripped cleanly, and against whose implementation?
  - type: textarea
    id: didnt
    attributes:
      label: What did not
      description: Fields you could not produce or read, precision you could not reach, wording you had to guess at, disagreements with another implementation.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Sample files
      description: A real FIT file is worth a page of description. Attach one, or link it, if you can share it.
  - type: input
    id: affiliation
    attributes:
      label: Your affiliation
